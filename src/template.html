<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>planr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet"> 
</head>
<body>
    <header>
        <div id="title">planr</div>
        <div id="hamburger">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu-icon lucide-menu"><path d="M4 12h16"/><path d="M4 18h16"/><path d="M4 6h16"/></svg>
        </div>
    </header>
    <dialog id="newtaskform">
        <div class="formcontainer">
            <div id="toprowform">
                <div id="closeform1">×</div>
            </div>
            <div id="formtitlet" class="formtitles">Title</div>
            <input id="tasktitle" type="text">
            <div class="formtitles">Description</div>
            <input id="taskdesc" type="text">
            <div class="formtitles">Date</div>
            <input id="taskdate" type="date">
            <button id="entertask">Add</button>
            </div>
        </div>
    </dialog>
    <dialog id="detailsmodal">
        <div class="detailcontainer">
            <div id="toprowform">
                <div id="closeform2">×</div>
            </div>
            <div class="detailcontent">
                <div id="detailtitlest" class="detailtitles">Title</div>
                <div id="detailtitlestd" class="detailtitles">Description:</div>
                <div id="detailtitlesda" class="detailtitles">Date:</div>
            </div>
        </div>
    </dialog>

    <dialog id="editmodal">
        <div class="formcontainer">
            <div id="toprowform">
                <div id="closeform3">×</div>
            </div>
            <div id="formtitlet" class="formtitles">Title</div>
            <input id="edittitle" type="text">
            <div class="formtitles">Description</div>
            <input id="editdesc" type="text">
            <div class="formtitles">Date</div>
            <input id="editdate" type="date">
            <button id="edittask">Save</button>
            </div>
        </div>
    </dialog>

    <div class="mainarea">
        <nav class="sidebar">
            <div class="mainstitle">Main</div>
            <div class="defaultnav">
                <button class="navitem" id="allbutton">
                    <span class="navicon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
                      </span>
                      Inbox
                </button>
            </div>
            <div class="projectstitle">Projects</div>
            <div class="projectnav">
                    <div class="userprojects">
                    </div>
                <button id="addproject">+ New Project</button>
            </div>
        </nav>
        <div class="display">
            <div class="displaycontain">
                <div class="displaytitle">Inbox</div>
                <button class="additem">+ New Task</button>
                <div class="taskdisplay"></div>
            </div>
        </div>
    </div>
    <footer class="footer">
        <div class="credit">Jack O'Reilly</div>
    </footer>
</body>
</html>
